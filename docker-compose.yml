version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: react-app

    ports:
      - '5173:80'

    depends_on:
      - keycloak

    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7

    container_name: keycloak

    command: start-dev

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    ports:
      - '8080:8080'

    restart: unless-stopped
