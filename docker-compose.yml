version: '3.9'

services:

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: react-app

    ports:
      - "5173:80"

    depends_on:
      - keycloak
      - backend

    restart: unless-stopped

    networks:
      - app-network


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: node-api

    ports:
      - "3000:3000"

    volumes:
      - ./Backend:/app
      - /app/node_modules

    depends_on:
      - keycloak

    restart: unless-stopped

    networks:
      - app-network


  keycloak:
    image: quay.io/keycloak/keycloak:26.7

    container_name: keycloak

    command: start-dev

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    ports:
      - "8080:8080"

    restart: unless-stopped

    networks:
      - app-network


networks:
  app-network:
    driver: bridge